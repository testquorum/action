name: "TestQuorum Runner"
description: "Download and run testquorum-runner in CI"
inputs:
  version:
    description: "Override the pinned testquorum-runner version. Defaults to the value pinned in the action source."
    required: false
  flake-ref:
    description: "Nix flake reference to build testquorum-runner from if the binary download returns 404. Without this input, a missing binary is a hard error."
    required: false
  token:
    description: "TestQuorum auth token. Passed to testquorum-runner via the TQ_AUTH_TOKEN environment variable. If empty or unset, no environment variable is set."
    required: false
  local_only:
    description: "If true, run testquorum-runner with the --local flag."
    required: false
    default: "false"
runs:
  using: "node24"
  main: "./dist/index.js"
